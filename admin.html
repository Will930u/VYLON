<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYLON | Control de Inventario & Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: {
                            500: '#dc2626',
                            600: '#b91c1c',
                            700: '#991b1b',
                            800: '#8b0000',
                            900: '#450a0a',
                        },
                        vylon: {
                            bg: '#121212',
                            card: '#18181b',
                            border: '#27272a',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #ffffff; }
        .glow-blood { box-shadow: 0 0 12px rgba(220, 38, 38, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-vylon-bg text-white">

    <header class="bg-vylon-card border-b border-vylon-border px-4 py-3 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-black tracking-widest text-white uppercase flex items-center gap-2">
                <i class="fa-solid fa-user-shield text-blood-500"></i> VYLON <span class="text-xs text-blood-500 font-semibold">[ADMIN]</span>
            </h1>
            <a href="index.html" class="text-xs bg-blood-900/50 hover:bg-blood-900 text-blood-500 px-3 py-1.5 rounded-lg border border-blood-800 transition">
                ← Ir al Catálogo
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-vylon-card p-4 rounded-xl border border-vylon-border">
                <p class="text-xs uppercase text-zinc-400 font-semibold">Total Ítems</p>
                <p id="metric-products" class="text-2xl font-black text-white mt-1">0</p>
            </div>
            <div class="bg-vylon-card p-4 rounded-xl border border-vylon-border">
                <p class="text-xs uppercase text-zinc-400 font-semibold">Stock Total Disponible</p>
                <p id="metric-stock" class="text-2xl font-black text-emerald-400 mt-1">0</p>
            </div>
            <div class="bg-vylon-card p-4 rounded-xl border border-vylon-border">
                <p class="text-xs uppercase text-zinc-400 font-semibold">Unidades Dañadas / Pérdida</p>
                <p id="metric-damaged" class="text-2xl font-black text-blood-500 mt-1">0</p>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-vylon-card p-4 rounded-xl border border-vylon-border">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-boxes-stacked text-blood-500"></i> Inventario de Productos
            </h2>
            <button onclick="openProductModal()" class="w-full sm:w-auto bg-blood-800 hover:bg-blood-700 text-white font-semibold px-4 py-2 rounded-lg border border-blood-600 transition flex items-center justify-center gap-2 text-sm glow-blood">
                <i class="fa-solid fa-plus"></i> Registrar Producto
            </button>
        </div>

        <div class="bg-vylon-card rounded-xl border border-vylon-border overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-zinc-300">
                    <thead class="bg-vylon-bg uppercase text-xs text-zinc-400 border-b border-vylon-border">
                        <tr>
                            <th class="p-4">SKU / Código</th>
                            <th class="p-4">Producto</th>
                            <th class="p-4">Precio ($ / Bs.)</th>
                            <th class="p-4">Stock</th>
                            <th class="p-4">Dañados</th>
                            <th class="p-4 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-vylon-border">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-product" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-vylon-card border border-vylon-border rounded-xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto space-y-4">
            <div class="flex justify-between items-center border-b border-vylon-border pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-white">Nuevo Producto</h3>
                <button onclick="closeProductModal()" class="text-zinc-400 hover:text-white text-xl">&times;</button>
            </div>

            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4">
                <input type="hidden" id="field-id">
                
                <div>
                    <label class="block text-xs uppercase text-zinc-400 mb-1 font-semibold">Código / SKU</label>
                    <div class="flex gap-2">
                        <input type="text" id="field-code" required class="flex-grow bg-vylon-bg border border-vylon-border rounded-lg p-2.5 text-white focus:border-blood-500">
                        <button type="button" onclick="startScanner('admin')" class="bg-blood-900 hover:bg-blood-800 text-blood-500 border border-blood-800 px-3 rounded-lg">
                            <i class="fa-solid fa-barcode"></i>
                        </button>
                    </div>
                </div>

                <div id="admin-scanner-container" class="hidden bg-vylon-bg p-2 rounded-lg border border-blood-700">
                    <div id="admin-interactive" class="viewport w-full h-36 bg-black rounded"></div>
                </div>

                <div>
                    <label class="block text-xs uppercase text-zinc-400 mb-1 font-semibold">Nombre del Producto</label>
                    <input type="text" id="field-name" required class="w-full bg-vylon-bg border border-vylon-border rounded-lg p-2.5 text-white focus:border-blood-500">
                </div>

                <div class="grid grid-cols-2 gap-4 bg-vylon-bg p-3 rounded-lg border border-vylon-border">
                    <div>
                        <label class="block text-xs text-blood-500 mb-1 font-bold">Precio (USDT / $)</label>
                        <input type="number" step="0.01" id="field-price-usd" oninput="calcPriceFromUSD()" required class="w-full bg-vylon-card border border-vylon-border rounded-lg p-2 text-white focus:border-blood-500">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1 font-bold">Precio Equiv. (Bs.)</label>
                        <input type="number" step="0.01" id="field-price-bs" oninput="calcPriceFromBS()" required class="w-full bg-vylon-card border border-vylon-border rounded-lg p-2 text-white focus:border-blood-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase text-zinc-400 mb-1 font-semibold">Stock Disponible</label>
                        <input type="number" id="field-stock" required class="w-full bg-vylon-bg border border-vylon-border rounded-lg p-2.5 text-white focus:border-blood-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-zinc-400 mb-1 font-semibold">Unidades Dañadas</label>
                        <input type="number" id="field-damaged" required class="w-full bg-vylon-bg border border-vylon-border rounded-lg p-2.5 text-white focus:border-blood-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase text-zinc-400 mb-1 font-semibold">URL de la Imagen</label>
                    <input type="url" id="field-image" placeholder="https://..." class="w-full bg-vylon-bg border border-vylon-border rounded-lg p-2.5 text-white focus:border-blood-500">
                </div>

                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeProductModal()" class="w-1/2 bg-vylon-bg hover:bg-zinc-800 text-white py-2.5 rounded-lg border border-vylon-border">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-blood-800 hover:bg-blood-700 text-white font-semibold py-2.5 rounded-lg border border-blood-600 transition glow-blood">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
