<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Afiliados - Vylon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Registro / Login -->
        <div id="affiliate-auth" class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-2xl font-bold mb-4">Registro de Afiliado</h2>
            <form id="affiliate-register-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">Alias (Único)</label>
                    <input type="text" id="aff-alias" placeholder="ej: pedro2026" required class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium">Banco (Código 4 dígitos)</label>
                    <input type="text" id="aff-bank" placeholder="0102" maxlength="4" required class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium">Teléfono Pago Móvil</label>
                    <input type="text" id="aff-phone" placeholder="04125866685" required class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium">Cédula de Identidad</label>
                    <input type="text" id="aff-ci" placeholder="25641163" required class="w-full border p-2 rounded mt-1">
                </div>
                <button type="submit" class="md:col-span-2 bg-blue-600 text-white font-bold py-2 rounded">Ingresar al Panel</button>
            </form>
        </div>

        <!-- Panel del Afiliado -->
        <div id="affiliate-dashboard" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold" id="dash-alias">Bienvenido</h2>
                    <p class="text-sm text-gray-500" id="dash-details"></p>
                </div>
                <button onclick="logoutAffiliate()" class="text-red-500 text-sm underline">Cerrar Sesión</button>
            </div>

            <!-- Métricas -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">Visitas generadas</p>
                    <p class="text-2xl font-bold" id="metric-clicks">0</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500">
                    <p class="text-sm text-gray-500">Comisiones Pendientes</p>
                    <p class="text-xl font-bold" id="metric-pending">$0.00 / 0.00 BS</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                    <p class="text-sm text-gray-500">Comisiones Verificadas</p>
                    <p class="text-xl font-bold text-green-600" id="metric-approved">$0.00 / 0.00 BS</p>
                </div>
            </div>

            <!-- Links de Productos -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold mb-4">Generador de Enlaces de Productos</h3>
                <div id="affiliate-products" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
