<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Afiliados - Vylon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between p-4 md:p-8">

    <div class="max-w-4xl mx-auto w-full space-y-6">
        <!-- Header -->
        <header class="bg-slate-950 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-white">Programa de Afiliados Vylon</h1>
                <p class="text-xs text-gray-400">Gana comisiones promoviendo nuestros productos</p>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2 rounded-xl border border-slate-700 font-bold transition">
                Volver a la Tienda
            </a>
        </header>

        <!-- Formulario de Acceso / Registro -->
        <div id="section-auth" class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 md:p-8 max-w-md mx-auto shadow-2xl">
            <div class="flex border-b border-slate-800 mb-6">
                <button onclick="switchAuthTab('login')" id="btn-tab-login" class="w-1/2 py-2 text-center font-bold text-xs border-b-2 border-blue-500 text-blue-400">Iniciar Sesión</button>
                <button onclick="switchAuthTab('register')" id="btn-tab-register" class="w-1/2 py-2 text-center font-bold text-xs border-b-2 border-transparent text-gray-500 hover:text-gray-300">Registrarse</button>
            </div>

            <!-- Iniciar Sesión -->
            <form id="form-login" onsubmit="handleAffiliateLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Alias (Usuario) o Correo</label>
                    <input type="text" id="login-identifier" required placeholder="utrera930@gmail.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-xl transition">
                    Entrar al Panel
                </button>
            </form>

            <!-- Registro -->
            <form id="form-register" onsubmit="handleAffiliateRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Nombre Completo</label>
                    <input type="text" id="reg-name" required placeholder="William Utrera" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Alias (Link Personalizado)</label>
                    <input type="text" id="reg-alias" required placeholder="william930" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="correo@ejemplo.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="••••••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 rounded-xl transition">
                    Crear Cuenta de Afiliado
                </button>
            </form>
        </div>

        <!-- Dashboard del Afiliado -->
        <div id="section-dashboard" class="hidden space-y-6">
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
                <div>
                    <h2 class="text-base font-bold text-white">Bienvenido, <span id="affiliate-name-display" class="text-blue-400">---</span></h2>
                    <p class="text-xs text-gray-400">Alias: <span id="affiliate-alias-display" class="font-mono text-white">---</span></p>
                </div>
                <button onclick="handleAffiliateLogout()" class="bg-red-900/40 hover:bg-red-800 text-red-200 text-xs px-4 py-2 rounded-xl font-bold border border-red-800/50 transition">
                    Cerrar Sesión
                </button>
            </div>

            <!-- Link Referido -->
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-2">
                <label class="block text-xs font-bold text-gray-400 uppercase">Tu Link de Referido</label>
                <div class="flex gap-2">
                    <input type="text" id="affiliate-referral-link" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-emerald-400 outline-none">
                    <button onclick="copyReferralLink()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap">
                        Copiar Link
                    </button>
                </div>
            </div>

            <!-- Métricas -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800">
                    <p class="text-xs text-gray-400 font-bold uppercase">Ventas Referidas</p>
                    <p id="aff-stat-sales" class="text-2xl font-black text-white mt-1">0</p>
                </div>
                <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800">
                    <p class="text-xs text-gray-400 font-bold uppercase">Comisión Generada ($)</p>
                    <p id="aff-stat-earnings" class="text-2xl font-black text-emerald-400 mt-1">$0.00 USDT</p>
                </div>
                <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800">
                    <p class="text-xs text-gray-400 font-bold uppercase">Comisión Generada (Bs)</p>
                    <p id="aff-stat-earnings-bs" class="text-2xl font-black text-blue-400 mt-1">Bs. 0.00</p>
                </div>
            </div>

            <!-- Histórico -->
            <div class="bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden">
                <div class="p-4 border-b border-slate-800 font-bold text-xs text-gray-400 uppercase">
                    Histórico de Pedidos Referidos
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-gray-300">
                        <thead class="bg-slate-900 text-gray-400 uppercase font-bold border-b border-slate-800">
                            <tr>
                                <th class="p-3">ID Pedido</th>
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Producto</th>
                                <th class="p-3">Monto Venta</th>
                                <th class="p-3">Tu Comisión</th>
                            </tr>
                        </thead>
                        <tbody id="affiliate-orders-tbody" class="divide-y divide-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script principal de lógica de la app -->
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof checkAffiliateSession === 'function') {
                checkAffiliateSession();
            }
        });

        function switchAuthTab(tab) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const btnLogin = document.getElementById('btn-tab-login');
            const btnRegister = document.getElementById('btn-tab-register');

            if (tab === 'login') {
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
                btnLogin.className = "w-1/2 py-2 text-center font-bold text-xs border-b-2 border-blue-500 text-blue-400";
                btnRegister.className = "w-1/2 py-2 text-center font-bold text-xs border-b-2 border-transparent text-gray-500 hover:text-gray-300";
            } else {
                formLogin.classList.add('hidden');
                formRegister.classList.remove('hidden');
                btnRegister.className = "w-1/2 py-2 text-center font-bold text-xs border-b-2 border-emerald-500 text-emerald-400";
                btnLogin.className = "w-1/2 py-2 text-center font-bold text-xs border-b-2 border-transparent text-gray-500 hover:text-gray-300";
            }
        }
    </script>
</body>
</html>
