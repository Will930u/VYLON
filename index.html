<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYLON | Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: {
                            500: '#dc2626',
                            600: '#b91c1c',
                            700: '#991b1b',
                            800: '#8b0000',
                            900: '#450a0a',
                        },
                        vylon: {
                            bg: '#121212',
                            card: '#18181b',
                            border: '#27272a',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #ffffff; }
        .glow-blood { box-shadow: 0 0 12px rgba(220, 38, 38, 0.3); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #450a0a; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-vylon-bg text-white">

    <header class="sticky top-0 z-40 bg-vylon-bg/95 backdrop-blur border-b border-vylon-border px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-blood-800 border-2 border-blood-500 flex items-center justify-center glow-blood">
                    <i class="fa-solid fa-droplet text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-widest text-white uppercase">VYLON</h1>
                    <p id="store-slogan" class="text-xs text-zinc-400">Entrega gratis en Maracay • Pago Móvil & USDT</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div class="hidden md:flex flex-col text-right px-3 py-1 bg-vylon-card border border-vylon-border rounded-lg">
                    <span class="text-[10px] text-zinc-400 uppercase tracking-wider">Tasa En Tiempo Real</span>
                    <span id="rate-badge" class="text-xs font-bold text-blood-500">Cargando Tasa...</span>
                </div>

                <button onclick="toggleCartModal()" class="relative bg-vylon-card hover:bg-zinc-800 text-white px-4 py-2 rounded-lg border border-vylon-border transition flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-blood-500"></i>
                    <span class="text-sm font-semibold">Carrito</span>
                    <span id="cart-counter" class="bg-blood-700 text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
        <div class="flex flex-col sm:flex-row gap-4 bg-vylon-card p-4 rounded-xl border border-vylon-border">
            <div class="relative flex-grow">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-zinc-500"></i>
                <input type="text" id="catalog-search" oninput="filterCatalog()" placeholder="Buscar por producto o escanea código SKU..." class="w-full bg-vylon-bg border border-vylon-border rounded-lg pl-10 pr-4 py-2.5 text-white focus:outline-none focus:border-blood-500">
            </div>
            <button onclick="startScanner('catalog')" class="bg-blood-800 hover:bg-blood-700 text-white px-4 py-2.5 rounded-lg border border-blood-600 transition flex items-center justify-center gap-2 font-semibold text-sm">
                <i class="fa-solid fa-barcode"></i> Escanear Código
            </button>
        </div>

        <div id="scanner-container" class="hidden bg-vylon-card p-4 rounded-xl border border-blood-700 relative">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-blood-500 uppercase"><i class="fa-solid fa-camera"></i> Escáner Activo</span>
                <button onclick="stopScanner()" class="text-zinc-400 hover:text-white text-sm">&times; Cerrar</button>
            </div>
            <div id="interactive" class="viewport w-full h-48 bg-black rounded-lg overflow-hidden"></div>
        </div>

        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <div id="modal-cart" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-vylon-card border border-vylon-border rounded-xl p-6 w-full max-w-lg flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b border-vylon-border pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-blood-500"></i> Tu Pedido
                </h3>
                <button onclick="toggleCartModal()" class="text-zinc-400 hover:text-white text-xl">&times;</button>
            </div>
            
            <div id="cart-items-list" class="flex-grow overflow-y-auto space-y-3 pr-2 my-2">
                </div>

            <div class="border-t border-vylon-border pt-4 space-y-3">
                <div class="space-y-1 text-right">
                    <div class="text-xl font-black text-blood-500" id="cart-total-usd">$0.00 USDT</div>
                    <div class="text-xs text-zinc-400" id="cart-total-bs">Bs. 0.00</div>
                </div>
                <input type="text" id="client-name" placeholder="Tu Nombre Completo" class="w-full bg-vylon-bg border border-vylon-border rounded-lg p-2.5 text-sm text-white focus:border-blood-500">
                <input type="text" id="client-phone" placeholder="Número Telefónico" class="w-full bg-vylon-bg border border-vylon-border rounded-lg p-2.5 text-sm text-white focus:border-blood-500">
                
                <button onclick="submitOrderWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
