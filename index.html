<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vylon Stock & Flow - Tienda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Vylon Stock & Flow</h1>
        <a href="afiliado.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold">Área de Afiliados</a>
    </nav>

    <div class="max-w-4xl mx-auto my-8 p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Catálogo de Productos</h2>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- Modal de Compra -->
    <div id="checkout-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4">
        <div class="bg-white p-6 rounded-lg max-w-md w-full">
            <h3 class="text-xl font-bold mb-4" id="modal-product-title">Comprar Producto</h3>
            <p class="text-gray-600 mb-2" id="modal-product-price"></p>
            <form id="checkout-form" class="space-y-4">
                <input type="hidden" id="checkout-prod-id">
                <div>
                    <label class="block text-sm font-medium">Nombre del Cliente</label>
                    <input type="text" id="client-name" required class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium">Adjuntar Captura de Pago Móvil</label>
                    <input type="file" id="payment-proof" accept="image/*" required class="w-full border p-2 rounded mt-1">
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeCheckout()" class="px-4 py-2 border rounded">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded font-bold">Enviar Comprobante</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
